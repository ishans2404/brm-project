version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# BSP BRM Live Inference Stack
# Services: redis | inference | api | frontend
#
# External services (already running at plant, reached via host.docker.internal):
#   PostgreSQL  → ibaPDA datastream
#   InfluxDB    → time-series metrics & prediction archive
#   MongoDB     → alert storage
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bsp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsp_net

  # ── Inference trigger ─────────────────────────────────────────────────────
  inference:
    build:
      context: ..               # BSP-INFERENCE-V2 project root
      dockerfile: docker/Dockerfile.inference
    container_name: bsp_inference
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis        # override localhost → redis service
    volumes:
      - ../trained_models:/app/trained_models:ro
      - ../sensor_data:/app/sensor_data:ro
      - ../profile_configs:/app/profile_configs:ro
      - ../binary_transforms:/app/binary_transforms:ro
      - ../utils:/app/utils:ro
      - ../ARCHIVE:/app/ARCHIVE
      - ../temp:/app/temp
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bsp_net
    # Allows containers to reach host PostgreSQL / InfluxDB / MongoDB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── FastAPI dashboard backend ──────────────────────────────────────────────
  api:
    build:
      context: api
      dockerfile: Dockerfile
    container_name: bsp_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bsp_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Nginx + React dashboard ────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: bsp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bsp_net

volumes:
  redis_data:

networks:
  bsp_net:
    driver: bridge
