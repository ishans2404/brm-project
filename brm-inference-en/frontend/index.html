<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSP BRM — Live Prediction Dashboard</title>

  <!-- React 18 + Babel + Chart.js via CDN (no build step needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <style>
    /* ─── Reset & Variables ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #060d1f;
      --bg2:         #0a1628;
      --card:        #0d1b35;
      --border:      #1a2d52;
      --border2:     #243650;
      --text:        #e2e8f0;
      --muted:       #64748b;
      --muted2:      #475569;
      --accent:      #0ea5e9;
      --green:       #10b981;
      --red:         #ef4444;
      --yellow:      #f59e0b;
      --purple:      #8b5cf6;
      --green-dim:   rgba(16,185,129,.15);
      --red-dim:     rgba(239,68,68,.15);
      --yellow-dim:  rgba(245,158,11,.15);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layout ────────────────────────────────────────────────────────── */
    #root { display: flex; flex-direction: column; min-height: 100vh; }

    /* ─── Header ────────────────────────────────────────────────────────── */
    .hdr {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .hdr-left { display: flex; align-items: center; gap: 12px; }
    .hdr-logo { font-size: 20px; }
    .hdr-title { font-size: 16px; font-weight: 700; color: #f8fafc; letter-spacing: .01em; }
    .hdr-sub {
      font-size: 11px; color: var(--muted);
      background: #1a2d4a; padding: 2px 8px; border-radius: 4px;
    }
    .hdr-right { display: flex; align-items: center; gap: 16px; }

    /* Connection dot */
    .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .dot-conn { background: var(--yellow); }
    .dot-disc { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .5; }
    }

    .clock { font-family: monospace; font-size: 13px; color: var(--muted2); }

    /* ─── Status bar ────────────────────────────────────────────────────── */
    .sbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 7px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .pill {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500;
      padding: 3px 10px; border-radius: 20px; border: 1px solid;
    }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill-on     { color: var(--green);  border-color: var(--green); }
    .pill-off    { color: var(--red);    border-color: var(--red); }
    .pill-warn   { color: var(--yellow); border-color: var(--yellow); }
    .pill-muted  { color: var(--muted);  border-color: var(--border2); }
    .pill-accent { color: var(--accent); border-color: var(--accent); }

    .sbar-right { margin-left: auto; font-size: 11px; color: var(--muted2); }

    /* ─── Alert banner ──────────────────────────────────────────────────── */
    .abanner { padding: 6px 20px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .abanner-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-radius: 6px; font-size: 13px;
    }
    .abanner-crit { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .abanner-warn { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }
    .abanner-ts   { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; }

    /* ─── Main ──────────────────────────────────────────────────────────── */
    .main { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; }

    /* ─── Cards row ─────────────────────────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 600px)  { .cards { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 18px 14px;
      transition: border-color .2s;
    }
    .card-ok    { border-color: rgba(16,185,129,.35); }
    .card-below { border-color: rgba(239,68,68,.45); }
    .card-above { border-color: rgba(245,158,11,.45); }

    .card-lbl {
      font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin-bottom: 10px;
    }
    .card-val {
      font-size: 44px; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums; margin-bottom: 4px;
    }
    .card-unit { font-size: 12px; color: var(--muted); }
    .card-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .card-spec { font-size: 11px; color: var(--muted2); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; margin-top: 10px;
    }
    .badge-ok    { background: rgba(16,185,129,.18); color: #34d399; }
    .badge-below { background: rgba(239,68,68,.18);  color: #f87171; }
    .badge-above { background: rgba(245,158,11,.18); color: #fbbf24; }
    .badge-unk   { background: rgba(100,116,139,.18);color: #94a3b8; }

    /* compliance summary card rows */
    .comp-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .comp-row:last-child { border-bottom: none; }
    .comp-key { font-size: 13px; font-weight: 500; }

    /* ─── Charts row ────────────────────────────────────────────────────── */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .chart-ttl  { font-size: 13px; font-weight: 600; color: var(--text); }
    .chart-sub  { font-size: 11px; color: var(--muted); margin: 2px 0 10px; }
    .chart-wrap { position: relative; height: 195px; }

    /* ─── Alert log ─────────────────────────────────────────────────────── */
    .alog {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .alog-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .alog-ttl { font-size: 13px; font-weight: 600; }
    .alog-cnt { font-size: 11px; color: var(--muted); }
    .alog-list {
      max-height: 160px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 4px;
    }
    .alog-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-radius: 5px;
      font-size: 12px; border-left: 3px solid;
    }
    .alog-crit { border-color: var(--red);    background: rgba(239,68,68,.07);  color: #fca5a5; }
    .alog-warn { border-color: var(--yellow); background: rgba(245,158,11,.07); color: #fcd34d; }
    .alog-info { border-color: var(--accent); background: rgba(14,165,233,.07); color: #7dd3fc; }
    .alog-ts   { font-size: 10px; color: var(--muted); white-space: nowrap; margin-left: 12px; }

    /* ─── Utilities ─────────────────────────────────────────────────────── */
    .no-data { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 0; }

    .spin {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
// ─── Constants ──────────────────────────────────────────────────────────────
const SPEC = {
  YS:  { min: 596,  max: 650,  unit: "MPa", label: "Yield Strength" },
  UTS: { min: 698,  max: 754,  unit: "MPa", label: "Ultimate Tensile Strength" },
  EL:  { min: 14.0, max: null, unit: "%",   label: "% Elongation" },
};

const MAX_PTS  = 60;   // chart history points
const WS_RETRY = 5000; // ms before reconnect

const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;

// Colour scheme
const COLORS = {
  YS:  "#0ea5e9",   // sky-500
  UTS: "#8b5cf6",   // violet-500
  EL:  "#10b981",   // emerald-500
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
const fmt = (v, d = 1) => v == null ? "—" : Number(v).toFixed(d);

const fmtTime = iso => {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString("en-IN", { hour12: false });
  } catch { return "—"; }
};

const compClass = s =>
  s === "OK" ? "card-ok" : s === "BELOW" ? "card-below" : s === "ABOVE" ? "card-above" : "";

const badgeClass = s =>
  s === "OK" ? "badge-ok" : s === "BELOW" ? "badge-below" : s === "ABOVE" ? "badge-above" : "badge-unk";

const badgeLabel = s =>
  s === "OK" ? "✓  WITHIN SPEC" : s === "BELOW" ? "↓  BELOW SPEC" :
  s === "ABOVE" ? "↑  ABOVE SPEC" : "—  UNKNOWN";

// ─── Chart component ─────────────────────────────────────────────────────────
function PredChart({ data, target, color, spec }) {
  const { useRef, useEffect } = React;
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;

    const labels  = data.map(r => fmtTime(r.time));
    const values  = data.map(r => r[target] ?? null);
    const specMin = Array(data.length).fill(spec.min);
    const specMax = spec.max != null ? Array(data.length).fill(spec.max) : null;

    const datasets = [
      {
        label: `${target} (${spec.unit})`,
        data: values,
        borderColor: color,
        backgroundColor: color + "20",
        borderWidth: 2,
        pointRadius: data.length > 25 ? 0 : 3,
        pointHoverRadius: 5,
        tension: 0.3,
        fill: false,
        spanGaps: true,
      },
      {
        label: `Min ${spec.min}`,
        data: specMin,
        borderColor: "#ef4444",
        borderDash: [5, 4],
        borderWidth: 1,
        pointRadius: 0,
        fill: false,
      },
    ];

    if (specMax) {
      datasets.push({
        label: `Max ${spec.max}`,
        data: specMax,
        borderColor: "#ef4444",
        borderDash: [5, 4],
        borderWidth: 1,
        pointRadius: 0,
        backgroundColor: "rgba(16,185,129,.04)",
        fill: "-1",
      });
    }

    // Update existing chart if it exists
    if (chartRef.current) {
      const c = chartRef.current;
      c.data.labels = labels;
      datasets.forEach((ds, i) => {
        if (c.data.datasets[i]) c.data.datasets[i].data = ds.data;
      });
      c.data.datasets[0].pointRadius = data.length > 25 ? 0 : 3;
      c.update("none");
      return;
    }

    // Create new chart
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 300 },
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            display: true,
            labels: { color: "#64748b", font: { size: 10 }, boxWidth: 10, padding: 8 },
          },
          tooltip: {
            backgroundColor: "#1e293b",
            borderColor: "#2d3f60",
            borderWidth: 1,
            titleColor: "#94a3b8",
            bodyColor: "#e2e8f0",
            padding: 8,
          },
        },
        scales: {
          x: {
            ticks: { color: "#475569", font: { size: 10 }, maxTicksLimit: 8, maxRotation: 0 },
            grid:  { color: "#1a2d52" },
          },
          y: {
            min:   spec.min ? spec.min - 20 : undefined,
            max:   spec.max ? spec.max + 20 : undefined,
            ticks: { color: "#475569", font: { size: 10 } },
            grid:  { color: "#1a2d52" },
          },
        },
      },
    });

    return () => {
      if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    };
  }, [data]);   // recreate only when data reference changes

  return (
    <div className="chart-wrap">
      {data.length === 0
        ? <div className="no-data">Waiting for prediction data…</div>
        : <canvas ref={canvasRef} />
      }
    </div>
  );
}

// ─── Prediction card ──────────────────────────────────────────────────────────
function PredCard({ target, value, compliance }) {
  const sp  = SPEC[target];
  const cls = compClass(compliance);
  const col = compliance === "OK"    ? "#10b981"
             : compliance === "BELOW" ? "#ef4444"
             : compliance === "ABOVE" ? "#f59e0b"
             : "#64748b";
  const decimals = target === "EL" ? 2 : 1;

  return (
    <div className={`card ${cls}`}>
      <div className="card-lbl">{sp.label}</div>
      <div className="card-val" style={{ color: col }}>
        {value != null ? fmt(value, decimals) : <span className="spin" />}
      </div>
      <div className="card-unit">{sp.unit}</div>
      <hr className="card-divider" />
      <div className="card-spec">
        Spec: {sp.min} – {sp.max ?? "—"} {sp.unit}
      </div>
      <span className={`badge ${badgeClass(compliance)}`}>
        {badgeLabel(compliance)}
      </span>
    </div>
  );
}

// ─── Compliance summary card ──────────────────────────────────────────────────
function CompCard({ compliance }) {
  return (
    <div className="card">
      <div className="card-lbl">Compliance Summary</div>
      <div style={{ marginTop: 10 }}>
        {["YS", "UTS", "EL"].map(k => (
          <div className="comp-row" key={k}>
            <span className="comp-key">{k}</span>
            <span className={`badge ${badgeClass(compliance?.[k] ?? "UNKNOWN")}`}>
              {compliance?.[k] ?? "UNKNOWN"}
            </span>
          </div>
        ))}
      </div>
      <hr className="card-divider" />
      <div className="card-spec" style={{ lineHeight: 1.6 }}>
        TMT-16mm FE-550D / SeQR-550D<br />
        IS 1786 Specification
      </div>
    </div>
  );
}

// ─── Alert banner ─────────────────────────────────────────────────────────────
function AlertBanner({ alerts }) {
  if (!alerts?.length) return null;
  return (
    <div className="abanner">
      {alerts.map((a, i) => (
        <div key={i} className={`abanner-item ${a.severity === "critical" ? "abanner-crit" : "abanner-warn"}`}>
          <span>{a.severity === "critical" ? "🔴" : "🟡"}</span>
          <span>{a.message}</span>
          <span className="abanner-ts">{fmtTime(a.timestamp)}</span>
        </div>
      ))}
    </div>
  );
}

// ─── Alert log ────────────────────────────────────────────────────────────────
function AlertLog({ alerts }) {
  return (
    <div className="alog">
      <div className="alog-hdr">
        <span className="alog-ttl">Alert History</span>
        <span className="alog-cnt">{alerts.length} recent events</span>
      </div>
      <div className="alog-list">
        {alerts.length === 0
          ? <div className="no-data">No recent alerts — all predictions within specification</div>
          : alerts.map((a, i) => (
              <div key={i} className={`alog-item alog-${a.severity || "info"}`}>
                <span>{a.message}</span>
                <span className="alog-ts">{fmtTime(a.timestamp)}</span>
              </div>
            ))
        }
      </div>
    </div>
  );
}

// ─── Clock ────────────────────────────────────────────────────────────────────
function Clock() {
  const [t, setT] = React.useState(new Date());
  React.useEffect(() => {
    const id = setInterval(() => setT(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return <span className="clock">{t.toLocaleTimeString("en-IN", { hour12: false })}</span>;
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const { useState, useEffect, useRef } = React;

  const [wsStatus, setWsStatus]  = useState("connecting");
  const [history, setHistory]    = useState([]);
  const [allAlerts, setAllAlerts]= useState([]);
  const [state, setState]        = useState({
    profile: "—",
    calibration_mode: true,
    mill_on: false,
    predictions:  { YS: null, UTS: null, EL: null, timestamp: null },
    compliance:   { YS: "UNKNOWN", UTS: "UNKNOWN", EL: "UNKNOWN" },
    alerts:       [],
    server_time:  null,
  });

  const wsRef   = useRef(null);
  const timerRef = useRef(null);

  // ── Fetch historical data on first load ──────────────────────────────────
  useEffect(() => {
    fetch("/api/history?hours=4")
      .then(r => r.json())
      .then(d => { if (d.history?.length) setHistory(d.history.slice(-MAX_PTS)); })
      .catch(() => {});

    fetch("/api/alerts/recent")
      .then(r => r.json())
      .then(d => { if (d.alerts?.length) setAllAlerts(d.alerts); })
      .catch(() => {});
  }, []);

  // ── WebSocket with auto-reconnect ─────────────────────────────────────────
  useEffect(() => {
    let ws;

    const connect = () => {
      setWsStatus("connecting");
      ws = new WebSocket(WS_URL);
      wsRef.current = ws;

      ws.onopen = () => setWsStatus("live");

      ws.onmessage = ({ data: raw }) => {
        try {
          const data = JSON.parse(raw);
          setState(data);

          // Append to chart history when predictions are present
          const p = data.predictions;
          if (p?.YS != null) {
            setHistory(prev => {
              const entry = {
                time: p.timestamp || data.server_time,
                YS: p.YS, UTS: p.UTS, EL: p.EL,
              };
              return [...prev.slice(-(MAX_PTS - 1)), entry];
            });
          }

          // Merge new alerts into the log
          if (data.alerts?.length) {
            setAllAlerts(prev => {
              const merged = [...data.alerts, ...prev];
              // Deduplicate by message + timestamp
              const seen = new Set();
              return merged.filter(a => {
                const key = `${a.target}_${a.timestamp}`;
                return seen.has(key) ? false : seen.add(key);
              }).slice(0, 60);
            });
          }
        } catch {}
      };

      ws.onclose = () => {
        setWsStatus("disconnected");
        timerRef.current = setTimeout(connect, WS_RETRY);
      };

      ws.onerror = () => setWsStatus("disconnected");
    };

    connect();
    return () => {
      clearTimeout(timerRef.current);
      if (wsRef.current) wsRef.current.close();
    };
  }, []);

  const { profile, calibration_mode, mill_on, predictions, compliance, alerts, server_time } = state;

  const dotClass = wsStatus === "live" ? "dot-live" : wsStatus === "connecting" ? "dot-conn" : "dot-disc";
  const wsLabel  = wsStatus === "live" ? "Live" : wsStatus === "connecting" ? "Connecting…" : "Reconnecting…";

  return (
    <>
      {/* ── Header ─────────────────────────────────────────────────────── */}
      <div className="hdr">
        <div className="hdr-left">
          <span className="hdr-logo">🏭</span>
          <span className="hdr-title">BSP BAR &amp; ROD MILL</span>
          <span className="hdr-sub">LIVE PREDICTION DASHBOARD</span>
        </div>
        <div className="hdr-right">
          <div className="conn">
            <div className={`dot ${dotClass}`} />
            <span>{wsLabel}</span>
          </div>
          <Clock />
        </div>
      </div>

      {/* ── Status bar ─────────────────────────────────────────────────── */}
      <div className="sbar">
        <div className={`pill ${mill_on ? "pill-on" : "pill-off"}`}>
          <div className="pill-dot" />
          MILL {mill_on ? "ON" : "OFF"}
        </div>

        <div className={`pill ${calibration_mode ? "pill-warn" : "pill-on"}`}>
          <div className="pill-dot" />
          {calibration_mode ? "CALIBRATION MODE" : "PRODUCTION MODE"}
        </div>

        <div className="pill pill-accent">
          <div className="pill-dot" />
          Profile: <strong style={{ marginLeft: 4 }}>{profile || "—"}</strong>
        </div>

        {predictions.timestamp && (
          <div className="sbar-right">
            Last prediction: {fmtTime(predictions.timestamp)}
            {server_time && <span style={{ marginLeft: 10 }}>Server: {fmtTime(server_time)}</span>}
          </div>
        )}
      </div>

      {/* ── Active alert banner ─────────────────────────────────────────── */}
      <AlertBanner alerts={alerts} />

      {/* ── Main content ────────────────────────────────────────────────── */}
      <div className="main">

        {/* Prediction cards */}
        <div className="cards">
          <PredCard target="YS"  value={predictions.YS}  compliance={compliance?.YS}  />
          <PredCard target="UTS" value={predictions.UTS} compliance={compliance?.UTS} />
          <PredCard target="EL"  value={predictions.EL}  compliance={compliance?.EL}  />
          <CompCard compliance={compliance} />
        </div>

        {/* Charts */}
        <div className="charts">
          <div className="chart-card">
            <div className="chart-ttl">Yield Strength — Prediction History</div>
            <div className="chart-sub">
              Last {history.length} points &nbsp;·&nbsp; Spec: 596 – 650 MPa
            </div>
            <PredChart data={history} target="YS"  color={COLORS.YS}  spec={SPEC.YS} />
          </div>
          <div className="chart-card">
            <div className="chart-ttl">Ultimate Tensile Strength — Prediction History</div>
            <div className="chart-sub">
              Last {history.length} points &nbsp;·&nbsp; Spec: 698 – 754 MPa
            </div>
            <PredChart data={history} target="UTS" color={COLORS.UTS} spec={SPEC.UTS} />
          </div>
        </div>

        {/* Alert log */}
        <AlertLog alerts={allAlerts} />

      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
